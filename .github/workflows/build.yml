
name: Nightfall ZIP to JAR

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -type f -name '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in repository."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -n 100

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e
          BUILD_FILE=$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle or build.gradle.kts found in ZIP."
            echo "The ZIP may contain source files without build configuration."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Build JAR
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon build
          elif [ -f ./gradlew.bat ]; then
            echo "Windows Gradle wrapper cannot run directly on Linux."
            exit 1
          else
            echo "No Gradle wrapper found."
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Nightfall-Client-JAR
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
          
